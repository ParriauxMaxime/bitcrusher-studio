backend:
  name: github
  repo: ParriauxMaxime/bitcrusher-studio
  branch: main
  base_url: https://bitcrusher-oauth.maxime-parriaux-25.workers.dev
  auth_endpoint: auth

site_url: https://parriauxmaxime.github.io/bitcrusher-studio
media_folder: public/media
public_folder: /media

i18n:
  structure: multiple_folders
  locales: [fr, en, es]
  default_locale: fr

collections:
  - name: site
    label: Settings
    i18n: true
    folder: content/site
    path: "{{slug}}"
    extension: yml
    format: yaml
    create: false
    fields:
      - { name: footer, widget: object, i18n: true, fields: [
          { name: email, widget: string, i18n: duplicate },
          { name: copyright, widget: string, i18n: true },
          { name: socials, widget: list, i18n: duplicate, fields: [
              { name: kind, widget: select, options: [soundcloud, youtube, linkedin, malt] },
              { name: url, widget: string },
              { name: label, widget: string }
            ]}
        ]}
      - { name: seo, widget: object, i18n: true, fields: [
          { name: site_name, widget: string, i18n: duplicate },
          { name: tagline, widget: string, i18n: true }
        ]}
      - { name: theme, widget: object, i18n: duplicate, fields: [
          { name: default, widget: select, options: [graphite, mahogany, synthwave, vapor] },
          { name: crt, widget: object, fields: [
              { name: scanlines, widget: number, value_type: int, min: 0, max: 100 },
              { name: glow, widget: number, value_type: int, min: 0, max: 100 },
              { name: aberration, widget: number, value_type: int, min: 0, max: 100 },
              { name: vignette, widget: number, value_type: int, min: 0, max: 100 },
              { name: flicker, widget: number, value_type: int, min: 0, max: 100 }
            ]}
        ]}

  - name: pages
    label: Pages
    i18n: true
    folder: content/pages
    path: "{{slug}}"
    extension: md
    format: frontmatter
    create: true
    fields:
      - { name: title, widget: string, i18n: true }
      - { name: description, widget: string, i18n: true }
      - { name: avatar, widget: image, required: false, i18n: duplicate }
      - { name: og_image, widget: image, required: false, i18n: duplicate }
      - { name: body, widget: markdown, i18n: true }

  - name: projects
    label: Projects
    folder: content/projects/fr
    extension: md
    format: frontmatter
    create: true
    fields:
      - { name: title, widget: string, i18n: true }
      - { name: order, widget: number, i18n: duplicate }
      - { name: featured, widget: boolean, default: false, i18n: duplicate }
      - { name: year, widget: number, i18n: duplicate }
      - { name: roles, widget: select, multiple: true, i18n: duplicate,
          options: [sound_design, music_composition, mixing, mastering, integration] }
      - { name: tags, widget: list, default: [], i18n: duplicate }
      - { name: cover, widget: image, i18n: duplicate }
      - { name: images, widget: list, default: [], i18n: duplicate }
      - { name: audio, widget: list, default: [], i18n: duplicate, fields: [
          { name: kind, widget: select, options: [file, soundcloud, youtube] },
          { name: src, widget: string, required: false },
          { name: url, widget: string, required: false },
          { name: title, widget: string }
        ]}
      - { name: links, widget: list, default: [], i18n: duplicate, fields: [
          { name: label, widget: string },
          { name: url, widget: string }
        ]}
      - { name: collaborators, widget: list, default: [], i18n: duplicate }
      - { name: body, widget: markdown, i18n: true }
