<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
	<defs>
		<!-- Scanlines pattern -->
		<pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse">
			<rect width="4" height="2" fill="transparent"/>
			<rect y="2" width="4" height="2" fill="rgba(0,0,0,0.1)"/>
		</pattern>
		<!-- Vignette -->
		<radialGradient id="vig" cx="50%" cy="50%" r="70%">
			<stop offset="0%" stop-color="transparent"/>
			<stop offset="100%" stop-color="rgba(0,0,0,0.45)"/>
		</radialGradient>
	</defs>
	<!-- Base -->
	<rect width="32" height="32" rx="6" fill="#1b2838"/>
	<!-- Scanlines -->
	<rect width="32" height="32" rx="6" fill="url(#sl)"/>
	<!-- Vignette -->
	<rect width="32" height="32" rx="6" fill="url(#vig)"/>
	<!-- Left column - chromatic ghost (red offset) -->
	<circle cx="11.5" cy="3" r="2.3" fill="rgba(255,90,74,0.2)"/>
	<circle cx="11.5" cy="9.5" r="2.3" fill="rgba(255,90,74,0.12)"/>
	<circle cx="11.5" cy="16" r="2.3" fill="rgba(255,90,74,0.12)"/>
	<circle cx="11.5" cy="22.5" r="2.3" fill="rgba(255,90,74,0.12)"/>
	<circle cx="11.5" cy="29" r="2.3" fill="rgba(255,90,74,0.12)"/>
	<!-- Right column - chromatic ghost (cyan offset) -->
	<circle cx="20.5" cy="3" r="2.3" fill="rgba(102,192,244,0.15)"/>
	<circle cx="20.5" cy="9.5" r="2.3" fill="rgba(102,192,244,0.12)"/>
	<circle cx="20.5" cy="16" r="2.3" fill="rgba(102,192,244,0.12)"/>
	<circle cx="20.5" cy="22.5" r="2.3" fill="rgba(102,192,244,0.12)"/>
	<circle cx="20.5" cy="29" r="2.3" fill="rgba(102,192,244,0.12)"/>
	<!-- Left column (main LEDs) -->
	<circle cx="12" cy="3" r="2.5" fill="#2a3a4a"/>
	<circle cx="12" cy="9.5" r="2.5" fill="#e8b62a"/>
	<circle cx="12" cy="16" r="2.5" fill="#e8b62a"/>
	<circle cx="12" cy="22.5" r="2.5" fill="#5ba32b"/>
	<circle cx="12" cy="29" r="2.5" fill="#5ba32b"/>
	<!-- Right column (main LEDs) -->
	<circle cx="20" cy="3" r="2.5" fill="#ff5a4a"/>
	<circle cx="20" cy="9.5" r="2.5" fill="#e8b62a"/>
	<circle cx="20" cy="16" r="2.5" fill="#e8b62a"/>
	<circle cx="20" cy="22.5" r="2.5" fill="#5ba32b"/>
	<circle cx="20" cy="29" r="2.5" fill="#5ba32b"/>
</svg>
