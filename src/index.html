<!doctype html>
<html lang="fr" data-theme="graphite">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Bitcrusher Studio</title>
		<script>
			(() => {
				var urlTheme, stored, chosen;
				try {
					urlTheme = new URLSearchParams(location.search).get("theme");
					stored = localStorage.getItem("theme");
					chosen = urlTheme || stored;
					if (chosen === "graphite" || chosen === "mahogany") {
						document.documentElement.dataset.theme = chosen;
						if (urlTheme) localStorage.setItem("theme", urlTheme);
					}
				} catch (_e) {}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
	</body>
</html>
