<!doctype html>
<html lang="fr" data-theme="vapor">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Bitcrusher Studio</title>
		<link rel="icon" type="image/svg+xml" href="favicon.svg" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
		/>
		<script>
			(() => {
				var urlTheme, stored, chosen;
				try {
					urlTheme = new URLSearchParams(location.search).get("theme");
					stored = localStorage.getItem("theme");
					chosen = urlTheme || stored;
					if (chosen === "graphite" || chosen === "mahogany" || chosen === "synthwave" || chosen === "vapor") {
						document.documentElement.dataset.theme = chosen;
						if (urlTheme) localStorage.setItem("theme", urlTheme);
					}
				} catch (_e) {}
			})();
		</script>
	</head>
	<body>
		<style>
			#root { opacity: 0; transition: opacity 0.3s ease; }
			.fonts-ready #root { opacity: 1; }
			#loader {
				position: fixed; inset: 0; z-index: 99999;
				display: flex; align-items: center; justify-content: center;
				background: var(--surface-base, #1b2838);
				transition: opacity 0.3s ease;
			}
			.fonts-ready #loader { opacity: 0; pointer-events: none; }
		</style>
		<div id="loader">
			<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Loading">
				<circle cx="12" cy="22.5" r="2.5" fill="#5ba32b"/>
				<circle cx="20" cy="22.5" r="2.5" fill="#5ba32b"/>
				<circle cx="12" cy="16" r="2.5" fill="#e8b62a"/>
				<circle cx="20" cy="16" r="2.5" fill="#e8b62a"/>
			</svg>
		</div>
		<div id="root"></div>
		<script>
			document.fonts.ready.then(() => {
				document.documentElement.classList.add('fonts-ready');
			});
		</script>
	</body>
</html>
