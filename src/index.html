<!doctype html>
<html lang="fr" data-theme="graphite">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Bitcrusher Studio</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
		/>
		<script>
			(() => {
				var urlTheme, stored, chosen;
				try {
					urlTheme = new URLSearchParams(location.search).get("theme");
					stored = localStorage.getItem("theme");
					chosen = urlTheme || stored;
					if (chosen === "graphite" || chosen === "mahogany") {
						document.documentElement.dataset.theme = chosen;
						if (urlTheme) localStorage.setItem("theme", urlTheme);
					}
				} catch (_e) {}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
	</body>
</html>
